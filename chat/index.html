<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Clinic Assistant · Halora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f5f2;--ink:#0f2523;--teal:#0e5c57;--gold:#e0b34f;--line:#dfe6e2;--muted:#5d716d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif}
.wrap{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line)}
body.embed .wrap{max-width:none;border:0}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--teal);color:#fff}
.av{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:600;color:var(--gold);flex:none}
header b{display:block;font-weight:600;font-size:16px}
header small{opacity:.8;font-size:12.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7ff0df;margin-right:6px;vertical-align:1px}
#log{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#f7faf8,#fff)}
.m{max-width:84%;padding:10px 13px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.b{align-self:flex-start;background:#eef4f1;border-bottom-left-radius:5px}
.u{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:5px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
.chips button{border:1px solid var(--line);background:#fff;color:var(--teal);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;outline:none}
input:focus{border-color:var(--teal)}
form button{border:0;border-radius:12px;background:var(--teal);color:#fff;padding:0 18px;font:inherit;font-weight:500;cursor:pointer}
form button:disabled{opacity:.5}
footer{text-align:center;font-size:11.5px;color:var(--muted);padding:0 0 10px}
footer a{color:var(--muted)}
[dir=rtl] .b{border-bottom-left-radius:16px;border-bottom-right-radius:5px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="av" id="av">N</div><div><b id="name">Clinic assistant</b><small><span class="dot"></span>Online 24/7 · replies in seconds</small></div></header>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips">
<button type="button">What are your prices?</button>
<button type="button">Book an appointment</button>
<button type="button">Opening hours</button>
<button type="button">Where are you?</button>
</div>
<form id="f"><input id="q" autocomplete="off" placeholder="Type your message..." maxlength="1000"><button id="send">Send</button></form>
<footer>AI assistant · <a href="https://askhalora.com" target="_blank" rel="noopener">powered by Halora</a></footer>
</div>
<script>
(function(){
var API='https://autova.app.n8n.cloud/webhook/halora-clinic-chat-4b8e2c';
var qs=new URLSearchParams(location.search), c=(qs.get('c')||'').toLowerCase();
if(qs.get('embed')) document.body.classList.add('embed');
var log=document.getElementById('log'), q=document.getElementById('q'), send=document.getElementById('send'), chips=document.getElementById('chips');
var session='';
try{session=localStorage.getItem('halora_s_'+c)||'';}catch(e){}
if(!session){session=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('halora_s_'+c,session);}catch(e){}}
function add(t,cls){var d=document.createElement('div');d.className='m '+cls;d.textContent=t;if(/[؀-ۿ]/.test(t))d.dir='rtl';log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function call(msg){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:c,session:session,message:msg})}).then(function(r){return r.json();});}
var busy=false;
function ask(msg){
if(busy||!msg)return; busy=true; send.disabled=true; chips.style.display='none';
add(msg,'u'); var t=document.createElement('div');t.className='typing';t.textContent='typing...';log.appendChild(t);log.scrollTop=log.scrollHeight;
call(msg).then(function(j){t.remove();add((j&&j.reply)||'Sorry, something went wrong. Please try again.','b');})
.catch(function(){t.remove();add('Connection problem. Please try again in a moment.','b');})
.then(function(){busy=false;send.disabled=false;q.focus();});
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var v=q.value.trim();q.value='';ask(v);});
chips.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')ask(e.target.textContent);});
if(!c){add('This chat link is missing the clinic code.','b');send.disabled=true;return;}
call('').then(function(j){
if(j&&j.clinic){document.getElementById('name').textContent=j.clinic;document.title=j.clinic+' · Assistant';document.getElementById('av').textContent=j.clinic.trim()[0].toUpperCase();}
add((j&&j.reply)||'Hi! How can I help?','b'); if(!j||j.ok===false){send.disabled=true;chips.style.display='none';}
}).catch(function(){add('Hi! How can I help?','b');});
})();
</script>
</body>
</html>
