<!doctype html>

<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Readex Pro",sans-serif;color:#0f2523;position:relative;background:
 radial-gradient(42% 60% at 86% 18%,#dff3ec 0,rgba(223,243,236,0) 70%),
 radial-gradient(36% 56% at 8% 96%,#f6ead2 0,rgba(246,234,210,0) 70%),
 radial-gradient(30% 40% at 96% 96%,#ece8fb 0,rgba(236,232,251,0) 70%),#fbfdfc}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(14,92,87,.16) 1.4px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:radial-gradient(60% 70% at 70% 40%,#000,transparent 75%)}
.in{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:500;letter-spacing:-.02em}
.brand svg{width:64px;height:64px;border-radius:16px;box-shadow:0 14px 28px -14px rgba(14,92,87,.7)}
.brand i{font-style:normal;color:#D9A441}
h1{margin-top:58px;font-size:96px;line-height:1;font-weight:400;letter-spacing:-.035em}
h1 b{display:block;font-weight:500;background:linear-gradient(95deg,#0e5c57 0%,#14897f 45%,#c8922c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ecg{margin-top:18px;width:560px;height:60px}
.ecg path{fill:none;stroke:#0e5c57;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sub{margin-top:auto;font-size:27px;color:#33423f;display:flex;gap:18px;align-items:center}
.sub span{background:#fff;border:1px solid #d3dcd7;border-radius:99px;padding:10px 20px}
.sub em{font-style:normal;color:#9a6c12;font-weight:500;margin-inline-start:auto}
.card{position:absolute;right:72px;top:150px;width:330px;background:#fff;border-radius:24px;padding:20px;box-shadow:0 30px 60px -30px rgba(15,37,35,.45);border:1px solid #e1e8e5}
.card .r{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#f6f8f7;font-size:19px;color:#61706c;margin-top:8px}
.card .r b{color:#33423f;font-weight:600;min-width:62px}
.card .r.ok{background:#e3f6ec;color:#11603f;box-shadow:inset 0 0 0 2px rgba(31,157,107,.45)}
.card .h{font-size:22px;font-weight:600;display:flex;justify-content:space-between}
.card .h small{font-size:16px;color:#11603f;font-weight:600}
html[dir=rtl] .card{right:auto;left:72px}
html[dir=rtl] h1,html[dir=rtl] .sub{letter-spacing:0}
html[dir=rtl] h1{font-size:88px;line-height:1.2}
html[dir=rtl] .ecg{transform:scaleX(-1)}
</style></head>
<body><div class="dots"></div><div class="in">
 <div class="brand" dir="ltr"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#0E5C57"/><path d="M19.5 23.5Q32 12.5 44.5 23.5" fill="none" stroke="#D9A441" stroke-width="5.2" stroke-linecap="round"/><path d="M22.5 29v21M41.5 29v21M22.5 39.5h19" fill="none" stroke="#F3F5F2" stroke-width="6.2" stroke-linecap="round"/></svg>Halora<i>.</i></div>
 <h1 id="h"></h1>
 <svg class="ecg" viewBox="0 0 560 60"><path d="M0 40h120l8-6 8 6h20l6 9 9-44 8 34 6-8h24l10-8 10 8h90l6 9 9-44 8 34 6-8h24l10-8 10 8h148"/></svg>
 <div class="sub" id="s"></div>
</div>
<div class="card" id="c"></div>

var ar=location.hash==='#ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';

 :'<div class="h">Saturday <small>Booked by Noor ✓</small></div><div class="r"><b>10:00</b>Cleaning</div><div class="r ok"><b>11:30</b>Whitening · Mariam</div><div class="r"><b>13:00</b>Free</div>';
